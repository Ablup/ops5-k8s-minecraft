apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: minecraft-monitor
  namespace: monitoring
  labels:
    release: monitoring  # Matches the Helm chart discovery rules
spec:
  selector:
    matchLabels:
      app: minecraft     # Tells it to look at minecraft service
  namespaceSelector:
    matchNames:
      - default          # The namespace where server lives
  endpoints:
  - port: metrics        # Matches the containerPort name from deployment
    interval: 10s        # Scrape frequency
